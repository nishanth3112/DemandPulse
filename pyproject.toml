[project]
name = "demandpulse"
version = "0.1.0"
description = "Retail revenue and demand intelligence platform on the dunnhumby Let's Get Sort-of-Real dataset"
readme = "README.md"
authors = [
    { name = "Nishanth Manoharan", email = "manoharan.ni@northeastern.edu" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.116",
    "duckdb>=1.5.6",
    "fsspec[http]>=2026.9.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.0",
]

[project.scripts]
demandpulse = "demandpulse:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need external resources (network, AWS); excluded from CI",
]

[tool.coverage.run]
source = ["src/demandpulse"]
branch = true
