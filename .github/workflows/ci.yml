name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Repository hygiene (no data files or secrets)
        run: uv run python -m demandpulse.hygiene

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing -m "not integration"

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build the dashboard image
        run: docker build -t demandpulse:ci .

      - name: Run the pipeline demo inside the image
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$RUNNER_TEMP/demo:/demo" --entrypoint demandpulse \
            demandpulse:ci demo --out /demo/lake --stores 34

      - name: Serve the dashboard from the demo snapshot
        run: |
          docker run -d --name dashboard -p 8501:8501 \
            -v "$RUNNER_TEMP/demo/lake/app:/data/app:ro" demandpulse:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs dashboard
          exit 1
