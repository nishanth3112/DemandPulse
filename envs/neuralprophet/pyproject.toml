# Isolated environment for the NeuralProphet forecaster. The main project pins pandas 3 and
# numpy 2, which NeuralProphet 0.9 does not support (it calls Series.view, removed in pandas 3),
# so it runs here and exchanges Parquet files with the main package.
[project]
name = "demandpulse-neuralprophet-env"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neuralprophet==0.9.0",
    "pandas>=2.2,<3",
    "numpy<2",
    "pyarrow>=15,<20",  # newer wheels require numpy 2, which NeuralProphet 0.9 cannot use
]

[tool.uv]
package = false
